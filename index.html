<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Dunking Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Arial', sans-serif;
            color: white;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        #characterSelector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 200;
            max-width: 500px;
        }
        
        #characterInput {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #ff5722;
            transform: translateY(-2px);
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .control-hint {
            margin: 5px 0;
            font-size: 14px;
        }
        
        #transformButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            font-size: 18px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <h2>Ultimate Dunking Simulator</h2>
            <div>Power: <span id="power">0</span>%</div>
            <div>Height: <span id="height">0</span>ft</div>
            <div>Character: <span id="currentCharacter">None</span></div>
        </div>
        
        <div id="characterSelector">
            <h2>Choose Your Character</h2>
            <p>You can be anything! What do you want to play as?</p>
            <input type="text" id="characterInput" placeholder="e.g., dragon, robot, dinosaur, superhero...">
            <br>
            <button onclick="generateCharacter()">Generate Character</button>
            <button onclick="useRandomCharacter()">Surprise Me!</button>
        </div>
        
        <div id="loadingScreen" style="display: none;">
            <div class="loading-spinner"></div>
            <h3 id="loadingText">Generating your character...</h3>
        </div>
        
        <div id="controls">
            <div class="control-hint">WASD - Move</div>
            <div class="control-hint">Space - Jump/Dunk</div>
            <div class="control-hint">Mouse - Look Around</div>
            <div class="control-hint">Hold Space - Charge Power</div>
        </div>
        
        <button id="transformButton" onclick="transformToBall()">Become the Ball!</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        
        class DunkingSimulator {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.controls = null;
                
                this.player = null;
                this.ball = null;
                this.court = null;
                this.hoop = null;
                
                this.isPlayerBall = false;
                this.jumpPower = 0;
                this.isCharging = false;
                this.playerVelocity = new THREE.Vector3();
                this.gravity = -0.02;
                this.groundLevel = 0;
                
                this.keys = {};
                this.currentCharacterName = "";
                this.assetCache = this.loadAssetCache();
                
                this.init();
            }
            
            loadAssetCache() {
                const cached = localStorage.getItem('dunkingSimAssets');
                return cached ? JSON.parse(cached) : {};
            }
            
            saveAssetCache() {
                localStorage.setItem('dunkingSimAssets', JSON.stringify(this.assetCache));
            }
            
            async init() {
                this.setupRenderer();
                this.setupLighting();
                await this.setupCourt();
                this.setupControls();
                this.setupEventListeners();
                this.animate();
            }
            
            setupRenderer() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x87CEEB);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('gameContainer').appendChild(this.renderer.domElement);
            }
            
            setupLighting() {
                // Ambient light
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambientLight);
                
                // Directional light (sun)
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, 100, 50);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                directionalLight.shadow.camera.near = 0.5;
                directionalLight.shadow.camera.far = 500;
                this.scene.add(directionalLight);
                
                // Stadium lights
                for (let i = 0; i < 4; i++) {
                    const light = new THREE.PointLight(0xffffff, 0.6, 100);
                    light.position.set(
                        Math.cos(i * Math.PI / 2) * 30,
                        25,
                        Math.sin(i * Math.PI / 2) * 30
                    );
                    this.scene.add(light);
                }
            }
            
            async setupCourt() {
                // Court floor with detailed markings
                const courtTexture = await this.getOrGenerateAsset('court_floor.png', 
                    'Professional basketball court floor with detailed orange and black lines, three-point arc, free throw line, center circle, team logos, wooden parquet texture, top-down view');
                
                const courtGeometry = new THREE.PlaneGeometry(50, 30);
                const courtMaterial = new THREE.MeshLambertMaterial({ 
                    map: courtTexture
                });
                this.court = new THREE.Mesh(courtGeometry, courtMaterial);
                this.court.rotation.x = -Math.PI / 2;
                this.court.receiveShadow = true;
                this.scene.add(this.court);
                
                // Basketball hoops with poles - both ends of court
                await this.createHoop(0, -15); // One end
                await this.createHoop(0, 15);  // Other end
                
                // Create initial ball
                await this.createBall();
                
                // Enhanced stadium environment
                await this.createDetailedStadium();
                
                // Add scoreboards and jumbotrons
                await this.createScoreboards();
                
                // Add atmospheric elements
                this.createAtmosphere();
            }

            async createHoop(x = 0, z = -15) {
                const hoopGroup = new THREE.Group();
                
                // Support pole
                const poleGeometry = new THREE.CylinderGeometry(0.2, 0.2, 10);
                const poleMaterial = new THREE.MeshLambertMaterial({ color: 0x555555 });
                const pole = new THREE.Mesh(poleGeometry, poleMaterial);
                pole.position.set(x, 5, z);
                pole.castShadow = true;
                hoopGroup.add(pole);
                
                // Pole base
                const baseGeometry = new THREE.CylinderGeometry(1, 1, 0.5);
                const baseMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.set(x, 0.25, z);
                hoopGroup.add(base);
                
                // Support arm
                const armGeometry = new THREE.BoxGeometry(0.3, 0.3, 4);
                const armMaterial = new THREE.MeshLambertMaterial({ color: 0x555555 });
                const arm = new THREE.Mesh(armGeometry, armMaterial);
                arm.position.set(x, 8, z > 0 ? z - 2 : z + 2);
                hoopGroup.add(arm);
                
                // Backboard with detailed texture
                const backboardTexture = await this.getOrGenerateAsset('backboard.png',
                    'Professional basketball backboard, white with orange rim, black target square, realistic glass reflection, brand logos');
                
                const backboardGeometry = new THREE.PlaneGeometry(6, 4);
                const backboardMaterial = new THREE.MeshPhongMaterial({ 
                    map: backboardTexture,
                    transparent: true,
                    shininess: 100
                });
                const backboard = new THREE.Mesh(backboardGeometry, backboardMaterial);
                backboard.position.set(x, 8, z > 0 ? z - 1 : z + 1);
                if (z > 0) backboard.rotation.y = Math.PI; // Flip for other end
                backboard.castShadow = true;
                hoopGroup.add(backboard);
                
                // Rim with better material
                const rimGeometry = new THREE.TorusGeometry(0.9, 0.05, 8, 16);
                const rimMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xff4500,
                    shininess: 80
                });
                const rim = new THREE.Mesh(rimGeometry, rimMaterial);
                rim.position.set(x, 6, z > 0 ? z + 1 : z - 1);
                rim.rotation.x = Math.PI / 2;
                rim.castShadow = true;
                hoopGroup.add(rim);
                
                // Detailed net with chain texture
                const netTexture = await this.getOrGenerateAsset('basketball_net.png',
                    'White basketball net with chain-link pattern, hanging from rim, transparent background');
                
                const netGeometry = new THREE.CylinderGeometry(0.8, 1.1, 2, 8, 1, true);
                const netMaterial = new THREE.MeshLambertMaterial({ 
                    map: netTexture,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
                const net = new THREE.Mesh(netGeometry, netMaterial);
                net.position.set(x, 4.5, z > 0 ? z + 1 : z - 1);
                hoopGroup.add(net);
                
                if (!this.hoop) this.hoop = hoopGroup; // Keep reference to first hoop
                this.scene.add(hoopGroup);
            }

            async createDetailedStadium() {
                // Main stadium structure with walls
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI * 2) / 8;
                    const radius = 45;
                    
                    // Stadium walls
                    const wallGeometry = new THREE.BoxGeometry(12, 20, 2);
                    const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x666666 });
                    const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                    wall.position.set(
                        Math.cos(angle) * radius,
                        10,
                        Math.sin(angle) * radius
                    );
                    wall.lookAt(0, 10, 0);
                    wall.castShadow = true;
                    wall.receiveShadow = true;
                    this.scene.add(wall);
                    
                    // Lower tier stands
                    const lowerStandGeometry = new THREE.BoxGeometry(12, 6, 4);
                    const lowerStandMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 });
                    const lowerStand = new THREE.Mesh(lowerStandGeometry, lowerStandMaterial);
                    lowerStand.position.set(
                        Math.cos(angle) * (radius - 3),
                        3,
                        Math.sin(angle) * (radius - 3)
                    );
                    lowerStand.lookAt(0, 3, 0);
                    lowerStand.castShadow = true;
                    this.scene.add(lowerStand);
                    
                    // Upper tier stands
                    const upperStandGeometry = new THREE.BoxGeometry(10, 8, 3);
                    const upperStandMaterial = new THREE.MeshLambertMaterial({ color: 0x555555 });
                    const upperStand = new THREE.Mesh(upperStandGeometry, upperStandMaterial);
                    upperStand.position.set(
                        Math.cos(angle) * (radius - 6),
                        8,
                        Math.sin(angle) * (radius - 6)
                    );
                    upperStand.lookAt(0, 8, 0);
                    upperStand.castShadow = true;
                    this.scene.add(upperStand);
                    
                    // Crowd texture for stands
                    const crowdTexture = await this.getOrGenerateAsset('crowd.png',
                        'Basketball arena crowd, diverse people cheering, colorful team jerseys, excited faces, stadium seating');
                    
                    const crowdGeometry = new THREE.PlaneGeometry(12, 4);
                    const crowdMaterial = new THREE.MeshLambertMaterial({ 
                        map: crowdTexture,
                        transparent: true 
                    });
                    const crowd = new THREE.Mesh(crowdGeometry, crowdMaterial);
                    crowd.position.set(
                        Math.cos(angle) * (radius - 5),
                        4,
                        Math.sin(angle) * (radius - 5)
                    );
                    crowd.lookAt(0, 4, 0);
                    this.scene.add(crowd);
                }
            }

            async createScoreboards() {
                // Main jumbotron
                const jumbotronTexture = await this.getOrGenerateAsset('jumbotron.png',
                    'Basketball arena jumbotron screen showing game stats, team logos, bright LED display, "DUNK SIMULATOR" text');
                
                const jumbotronGeometry = new THREE.PlaneGeometry(8, 4);
                const jumbotronMaterial = new THREE.MeshPhongMaterial({ 
                    map: jumbotronTexture,
                    emissive: 0x222222,
                    transparent: true 
                });
                const jumbotron = new THREE.Mesh(jumbotronGeometry, jumbotronMaterial);
                jumbotron.position.set(0, 20, 0);
                jumbotron.rotation.x = -Math.PI / 6;
                this.scene.add(jumbotron);
                
                // Side scoreboards
                for (let i = 0; i < 2; i++) {
                    const scoreboardTexture = await this.getOrGenerateAsset(`scoreboard_${i}.png`,
                        'Digital basketball scoreboard with team names, score numbers, game clock, LED style display');
                    
                    const scoreboardGeometry = new THREE.PlaneGeometry(4, 2);
                    const scoreboardMaterial = new THREE.MeshPhongMaterial({ 
                        map: scoreboardTexture,
                        emissive: 0x111111,
                        transparent: true 
                    });
                    const scoreboard = new THREE.Mesh(scoreboardGeometry, scoreboardMaterial);
                    scoreboard.position.set(i === 0 ? -25 : 25, 12, 0);
                    scoreboard.rotation.y = i === 0 ? Math.PI / 2 : -Math.PI / 2;
                    this.scene.add(scoreboard);
                }
            }
            
            createAtmosphere() {
                // Spotlights with cone effects
                for (let i = 0; i < 6; i++) {
                    const spotlight = new THREE.SpotLight(0xffffff, 0.8, 50, Math.PI / 6, 0.3);
                    spotlight.position.set(
                        Math.cos(i * Math.PI / 3) * 30,
                        22,
                        Math.sin(i * Math.PI / 3) * 30
                    );
                    spotlight.target.position.set(0, 0, 0);
                    spotlight.castShadow = true;
                    this.scene.add(spotlight);
                    this.scene.add(spotlight.target);
                    
                    // Visible light cone
                    const coneGeometry = new THREE.ConeGeometry(8, 15, 8, 1, true);
                    const coneMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.1,
                        side: THREE.DoubleSide
                    });
                    const cone = new THREE.Mesh(coneGeometry, coneMaterial);
                    cone.position.copy(spotlight.position);
                    cone.position.y -= 7;
                    cone.rotation.x = Math.PI;
                    this.scene.add(cone);
                }
                
                // Floating particles for atmosphere
                this.createFloatingParticles();
            }
            
            createFloatingParticles() {
                const particleCount = 100;
                const particleGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 100;
                    positions[i + 1] = Math.random() * 30;
                    positions[i + 2] = (Math.random() - 0.5) * 100;
                }
                
                particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                const particleMaterial = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.1,
                    transparent: true,
                    opacity: 0.6
                });
                
                const particles = new THREE.Points(particleGeometry, particleMaterial);
                this.scene.add(particles);
                
                // Animate particles
                this.animateParticles = () => {
                    const positions = particles.geometry.attributes.position.array;
                    for (let i = 1; i < positions.length; i += 3) {
                        positions[i] += 0.01;
                        if (positions[i] > 30) positions[i] = 0;
                    }
                    particles.geometry.attributes.position.needsUpdate = true;
                };
            }

            async createBall() {
                const ballTexture = await this.getOrGenerateAsset('basketball.png',
                    'Orange basketball with black curved lines, realistic texture');
                
                const ballGeometry = new THREE.SphereGeometry(0.6, 32, 32);
                const ballMaterial = new THREE.MeshLambertMaterial({ 
                    map: ballTexture,
                    transparent: true 
                });
                this.ball = new THREE.Mesh(ballGeometry, ballMaterial);
                this.ball.position.set(5, 1, 0);
                this.ball.castShadow = true;
                this.scene.add(this.ball);
            }

            async getOrGenerateAsset(filename, prompt) {
                if (this.assetCache[filename]) {
                    // Load from cache
                    const loader = new THREE.TextureLoader();
                    return new Promise((resolve) => {
                        loader.load(this.assetCache[filename], resolve);
                    });
                } else {
                    // Generate new asset
                    const result = await websim.imageGen({
                        prompt: prompt,
                        transparent: true,
                        aspect_ratio: "1:1"
                    });
                    
                    // Cache the asset
                    this.assetCache[filename] = result.url;
                    this.saveAssetCache();
                    
                    const loader = new THREE.TextureLoader();
                    return new Promise((resolve) => {
                        loader.load(result.url, resolve);
                    });
                }
            }
            
            setupControls() {
                this.controls = new PointerLockControls(this.camera, this.renderer.domElement);
                this.camera.position.set(0, 5, 10);
                
                // Click to enable controls
                this.renderer.domElement.addEventListener('click', () => {
                    if (document.getElementById('characterSelector').style.display !== 'none') return;
                    this.controls.lock();
                });
            }
            
            setupEventListeners() {
                // Keyboard events
                document.addEventListener('keydown', (event) => {
                    this.keys[event.code] = true;
                    
                    if (event.code === 'Space') {
                        event.preventDefault();
                        this.isCharging = true;
                    }
                });
                
                document.addEventListener('keyup', (event) => {
                    this.keys[event.code] = false;
                    
                    if (event.code === 'Space') {
                        this.jump();
                        this.isCharging = false;
                    }
                });
                
                // Window resize
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
            
            async generateCharacter(characterName) {
                this.showLoading(true, `Generating ${characterName}...`);
                
                try {
                    const characterTexture = await this.getOrGenerateAsset(
                        `character_${characterName.toLowerCase().replace(/\s+/g, '_')}.png`,
                        `${characterName} character for basketball game, full body, athletic pose, transparent background`
                    );
                    
                    // Remove old player
                    if (this.player) {
                        this.scene.remove(this.player);
                    }
                    
                    // Create new player
                    const playerGeometry = new THREE.BoxGeometry(1.5, 3, 0.5);
                    const playerMaterial = new THREE.MeshLambertMaterial({ 
                        map: characterTexture,
                        transparent: true 
                    });
                    this.player = new THREE.Mesh(playerGeometry, playerMaterial);
                    this.player.position.set(0, 1.5, 5);
                    this.player.castShadow = true;
                    this.scene.add(this.player);
                    
                    this.currentCharacterName = characterName;
                    document.getElementById('currentCharacter').textContent = characterName;
                    document.getElementById('characterSelector').style.display = 'none';
                    
                } catch (error) {
                    console.error('Error generating character:', error);
                } finally {
                    this.showLoading(false);
                }
            }
            
            showLoading(show, text = 'Loading...') {
                const loadingScreen = document.getElementById('loadingScreen');
                const loadingText = document.getElementById('loadingText');
                loadingScreen.style.display = show ? 'flex' : 'none';
                loadingText.textContent = text;
            }
            
            jump() {
                if (this.player && this.player.position.y <= this.groundLevel + 1.6) {
                    const power = Math.min(this.jumpPower, 100);
                    this.playerVelocity.y = 0.3 + (power / 100) * 0.4;
                    this.jumpPower = 0;
                }
            }
            
            update() {
                if (!this.player) return;
                
                // Movement
                const speed = 0.1;
                const direction = new THREE.Vector3();
                
                if (this.keys['KeyW']) direction.z -= 1;
                if (this.keys['KeyS']) direction.z += 1;
                if (this.keys['KeyA']) direction.x -= 1;
                if (this.keys['KeyD']) direction.x += 1;
                
                if (direction.length() > 0) {
                    direction.normalize();
                    this.player.position.add(direction.multiplyScalar(speed));
                }
                
                // Charging jump power
                if (this.isCharging && this.jumpPower < 100) {
                    this.jumpPower += 2;
                }
                
                // Gravity
                this.playerVelocity.y += this.gravity;
                this.player.position.add(this.playerVelocity);
                
                // Ground collision
                if (this.player.position.y <= this.groundLevel + 1.5) {
                    this.player.position.y = this.groundLevel + 1.5;
                    this.playerVelocity.y = 0;
                }
                
                // Update camera to follow player
                if (this.controls.isLocked && !this.isPlayerBall) {
                    this.camera.position.x = this.player.position.x;
                    this.camera.position.z = this.player.position.z + 3;
                }
                
                // Update UI
                document.getElementById('power').textContent = Math.round(this.jumpPower);
                document.getElementById('height').textContent = Math.round((this.player.position.y - 1.5) * 3.28);
                
                // Check for dunk
                this.checkDunk();
                
                // Animate floating particles
                if (this.animateParticles) {
                    this.animateParticles();
                }
            }
            
            checkDunk() {
                if (!this.player || !this.hoop) return;
                
                const distance = this.player.position.distanceTo(new THREE.Vector3(0, 6, -11));
                if (distance < 3 && this.player.position.y > 5) {
                    // Successful dunk!
                    this.celebrateDunk();
                }
            }
            
            celebrateDunk() {
                // Visual celebration effect
                for (let i = 0; i < 20; i++) {
                    const particle = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1),
                        new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff })
                    );
                    particle.position.copy(this.player.position);
                    particle.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.3,
                        (Math.random() - 0.5) * 0.3
                    );
                    this.scene.add(particle);
                    
                    // Remove particles after a delay
                    setTimeout(() => this.scene.remove(particle), 2000);
                }
            }
            
            transformToBall() {
                if (!this.player) return;
                
                this.isPlayerBall = !this.isPlayerBall;
                
                if (this.isPlayerBall) {
                    // Hide player, control ball
                    this.player.visible = false;
                    this.ball.position.copy(this.player.position);
                    document.getElementById('transformButton').textContent = 'Become Character!';
                } else {
                    // Show player, ball independent
                    this.player.visible = true;
                    this.player.position.copy(this.ball.position);
                    document.getElementById('transformButton').textContent = 'Become the Ball!';
                }
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                this.update();
                this.renderer.render(this.scene, this.camera);
            }
        }
        
        // Global functions
        window.generateCharacter = async function() {
            const input = document.getElementById('characterInput').value.trim();
            if (!input) {
                alert('Please enter a character description!');
                return;
            }
            await game.generateCharacter(input);
        };
        
        window.useRandomCharacter = async function() {
            const randomCharacters = [
                'dragon', 'robot', 'dinosaur', 'superhero', 'wizard', 'ninja',
                'alien', 'pirate', 'vampire', 'werewolf', 'knight', 'astronaut',
                'elephant', 'giraffe', 'penguin', 'octopus', 'phoenix', 'unicorn'
            ];
